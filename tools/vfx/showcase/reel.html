#ui{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:6px}

#ui button:focus-visible{outline:2px solid #7d9cff}
#err{position:fixed;left:8px;bottom:8px;margin:0;color:#ff8a8a;font:12px monospace;white-space:pre-wrap}
</style>

const $ = id => document.getElementById(id), err = m => { $('err').textContent += m + '\n' }
const cv = $('gl'), hud = $('hud'), hx = hud.getContext('2d')
const gl = cv.getContext('webgl2', { antialias: true, premultipliedAlpha: true, alpha: false })
if (!gl) err('WebGL2 not available')
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255)
function prog(vs, fs) {
  const p = gl.createProgram()
  for (const [t, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s)
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) err(gl.getShaderInfoLog(s)); gl.attachShader(p, s)
  }
  gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) err(gl.getProgramInfoLog(p))
  const u = {}; for (let i = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i--;) { const n = gl.getActiveUniform(p, i).name; u[n] = gl.getUniformLocation(p, n) }
  return { p, u }
}
const NOISE = `
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(h21(i),h21(i+vec2(1.0,0.0)),f.x),mix(h21(i+vec2(0.0,1.0)),h21(i+vec2(1.0,1.0)),f.x),f.y);}
float fbm(vec2 p){float a=0.5,s=0.0;for(int i=0;i<4;i++){s+=a*vn(p);p*=2.03;a*=0.5;}return s;}
float cells(vec2 p){vec2 i=floor(p),f=fract(p);float d=1.0;
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 o=vec2(float(x),float(y));vec2 r=o+vec2(h21(i+o),h21(i+o+7.7))-f;d=min(d,dot(r,r));}return sqrt(d);}`
// Layer card: flipbook frame blend, texture overlay into alpha, gradient map by light, colour over life (lookup cools as it dies).
const FX = prog(`#version 300 es
in vec2 c; uniform vec2 uPos,uSize,uShake; uniform float uRot,uAsp,uZoom; out vec2 vUv;
void main(){ vUv=c+0.5; float s=sin(uRot),k=cos(uRot); vec2 p=c*uSize; p=vec2(k*p.x-s*p.y,s*p.x+k*p.y)+uPos;
  p=p*uZoom+uShake; gl_Position=vec4(p.x*2.0/uAsp,p.y*2.0,0.0,1.0); }`,
`#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform sampler2D uMap,uRamp; uniform float uFrame,uU,uK,uAmt,uTex,uSeed,uNorm,uTime,uOl,uCore; uniform vec3 uOlCol;
${NOISE}
float cellA(float f,vec2 uv){ float col=mod(f,4.0),row=floor(f/4.0); return texture(uMap,(vec2(col,row)+uv)/4.0).a; }
float shp(vec2 uv,float f0,float f1,float w){ uv=clamp(uv,0.004,0.996); return smoothstep(0.12,0.3,mix(cellA(f0,uv),cellA(f1,uv),w)); }
void main(){
  vec2 uv=clamp(vec2(vUv.x,1.0-vUv.y),0.004,0.996);
  float f0=floor(uFrame),f1=min(f0+1.0,15.0),w=fract(uFrame);
  float a=mix(cellA(f0,uv),cellA(f1,uv),w);
  // Outline styles (core layer only): 1 ink, 2 colour rim, 3 hot inner edge, 4 toon (cel bands + ink). Edge = 8-tap dilate/erode of the shape.
  float ol=(uCore>0.5)?uOl:0.0, outer=0.0, inner=0.0;
  // Rim (default) width 0.0048 = 70% thinner than the others (owner 2026-11-26: "way too thick").
  if(ol>0.5){ float s0=smoothstep(0.12,0.3,a),mx=0.0,mn=1.0,ow=(ol>1.5&&ol<2.5)?0.0048:0.016;
    for(int i=0;i<8;i++){ float an=float(i)*0.7853982; float q=shp(uv+vec2(cos(an),sin(an))*ow,f0,f1,w); mx=max(mx,q); mn=min(mn,q); }
    outer=mx*(1.0-s0); inner=s0*(1.0-mn); }
  vec2 q=vUv*3.0+uSeed; float n;
  if(uTex<0.5) n=fbm(q+vec2(0.0,-uTime*0.6));
  else if(uTex<1.5) n=1.0-cells(q*1.6+vec2(uTime*0.2,0.0))*1.2;
  else n=fbm(vec2(q.x*0.7,q.y*5.0-uTime*1.5));
  a*=mix(1.0,0.5+0.9*clamp(n,0.0,1.0),uAmt);
  float fade=smoothstep(0.0,0.05,uU)*(1.0-smoothstep(0.82,1.0,uU));
  float x=clamp(a,0.0,1.0);
  if(ol>3.5){ x=(floor(x*3.0)+1.0)/3.0*smoothstep(0.16,0.22,x); }
  vec3 col=texture(uRamp,vec2(x*mix(1.0,0.6,uU),0.5)).rgb;
  float al=x*fade;
  o = uNorm>0.5 ? vec4(col*al*uK,al*uK) : vec4(col*al*uK,0.0);
  float ink=(ol>0.5&&ol<1.5||ol>3.5)?outer*fade*0.95:0.0;
  o += vec4(vec3(0.02,0.01,0.04)*ink,ink);
  if(ol>1.5&&ol<2.5) o.rgb+=uOlCol*outer*fade*1.3;
  if(ol>2.5&&ol<3.5) o.rgb+=vec3(1.0)*inner*fade*0.9;
}`)

const BG = prog(`#version 300 es
in vec2 c; out vec2 vP; uniform float uAsp; void main(){ vP=vec2(c.x*uAsp,c.y)*0.5; gl_Position=vec4(c,0.0,1.0); }`,
`#version 300 es
precision highp float; in vec2 vP; out vec4 o; uniform vec3 uCol; uniform float uLight,uFloor,uTime;
${NOISE}
void main(){
  vec2 p=vP; vec3 c=mix(vec3(0.03,0.027,0.06),vec3(0.06,0.06,0.11),smoothstep(-0.5,0.5,p.y));
  float fl=step(p.y,uFloor);

    float line=smoothstep(0.96,1.0,abs(fract(g.x)-0.5)*2.0)+smoothstep(0.96,1.0,abs(fract(g.y)-0.5)*2.0);
    c=vec3(0.035,0.032,0.055)+line*0.025*smoothstep(0.0,0.3,d)*(1.0-smoothstep(0.3,0.6,d)); }
  vec2 e=(p-vec2(0.0,uFloor))/vec2(0.62,0.1); float pool=exp(-dot(e,e)*1.6)*fl;
  vec2 b=(p-vec2(0.0,0.0))/vec2(0.7,0.55); float back=exp(-dot(b,b)*2.2);
  c+=uCol*(pool*(0.08+0.55*uLight)+back*(0.03+0.16*uLight));
  c*=1.0-0.55*dot(p*vec2(0.8,1.1),p*vec2(0.8,1.1));
  c+=(h21(gl_FragCoord.xy+fract(uTime)*91.0)-0.5)*0.012;
  o=vec4(c,1.0);
}`)

function ramp(stops) {
  const cs = stops.split(',').map(hex), d = new Uint8Array(256 * 4)
  for (let i = 0; i < 256; i++) { const x = i / 255 * (cs.length - 1), j = Math.min(Math.floor(x), cs.length - 2), w = x - j
    for (let k = 0; k < 3; k++) d[i * 4 + k] = Math.round((cs[j][k] * (1 - w) + cs[j + 1][k] * w) * 255); d[i * 4 + 3] = 255 }
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t)
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, d)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
  return t
}

const OL = ['none', 'ink', 'rim', 'hot', 'toon'], HUD = ['bar', 'frame', 'minimal'], qs = new URLSearchParams(location.search)
const ST = { ol: Math.max(0, OL.indexOf(qs.get('ol') || 'rim')), hud: Math.max(0, HUD.indexOf(qs.get('hud'))) } // owner 2026-11-26: rim (shot colour, brighter) is the default outline
window.reelStyle = (ol, hud) => { if (ol != null) ST.ol = Math.max(0, OL.indexOf(ol)); if (hud != null) ST.hud = Math.max(0, HUD.indexOf(hud)); syncUi() }
function size(w, h) { if (w === W && h === H) return; W = cv.width = hud.width = w; H = cv.height = hud.height = h }
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x)
function attr(p, buf) { gl.bindBuffer(gl.ARRAY_BUFFER, buf); const l = gl.getAttribLocation(p, 'c'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0) }
function render(T) {

  const si = Math.min(Math.floor(T / SHOT), SHOTS.length - 1), sh = SHOTS[si], ts = T - si * SHOT, asp = W / H
  const since = ts - sh.hit, hitEnv = since < 0 ? 0 : Math.exp(-since * (2 + sh.aggr * 0.6))
  const pre = since < 0 ? ease((ts) / Math.max(sh.hit, .01)) * 0.25 : 0
  const amp = RM ? 0 : [0, 0, .002, .006, .012, .022][sh.aggr] * hitEnv
