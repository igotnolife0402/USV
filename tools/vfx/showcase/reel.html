const NOISE = `
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(h21(i),h21(i+vec2(1.0,0.0)),f.x),mix(h21(i+vec2(0.0,1.0)),h21(i+vec2(1.0,1.0)),f.x),f.y);}
float fbm(vec2 p){float a=0.5,s=0.0;for(int i=0;i<4;i++){s+=a*vn(p);p*=2.03;a*=0.5;}return s;}
float cells(vec2 p){vec2 i=floor(p),f=fract(p);float d=1.0;
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 o=vec2(float(x),float(y));vec2 r=o+vec2(h21(i+o),h21(i+o+7.7))-f;d=min(d,dot(r,r));}return sqrt(d);}`
// Layer card: flipbook frame blend, texture overlay into alpha, gradient map by light, colour over life (lookup cools as it dies).
const FX = prog(`#version 300 es
in vec2 c; uniform vec2 uPos,uSize,uShake; uniform float uRot,uAsp,uZoom; out vec2 vUv;
void main(){ vUv=c+0.5; float s=sin(uRot),k=cos(uRot); vec2 p=c*uSize; p=vec2(k*p.x-s*p.y,s*p.x+k*p.y)+uPos;
  p=p*uZoom+uShake; gl_Position=vec4(p.x*2.0/uAsp,p.y*2.0,0.0,1.0); }`,
`#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform sampler2D uMap,uRamp; uniform float uFrame,uU,uK,uAmt,uTex,uSeed,uNorm,uTime;
${NOISE}
float cellA(float f,vec2 uv){ float col=mod(f,4.0),row=floor(f/4.0); return texture(uMap,(vec2(col,row)+uv)/4.0).a; }
void main(){
  vec2 uv=clamp(vec2(vUv.x,1.0-vUv.y),0.004,0.996);

  float a=mix(cellA(f0,uv),cellA(f1,uv),w);
  vec2 q=vUv*3.0+uSeed; float n;
  if(uTex<0.5) n=fbm(q+vec2(0.0,-uTime*0.6));
  else if(uTex<1.5) n=1.0-cells(q*1.6+vec2(uTime*0.2,0.0))*1.2;
  else n=fbm(vec2(q.x*0.7,q.y*5.0-uTime*1.5));
  a*=mix(1.0,0.5+0.9*clamp(n,0.0,1.0),uAmt);
  float fade=smoothstep(0.0,0.05,uU)*(1.0-smoothstep(0.82,1.0,uU));
  vec3 col=texture(uRamp,vec2(clamp(a,0.0,1.0)*mix(1.0,0.6,uU),0.5)).rgb;
  float al=clamp(a,0.0,1.0)*fade;
  o = uNorm>0.5 ? vec4(col*al*uK,al*uK) : vec4(col*al*uK,0.0);
}`)
// Stage: night sky, floor with faint perspective grid, light pool and back glow in the shot colour.
const BG = prog(`#version 300 es
in vec2 c; out vec2 vP; uniform float uAsp; void main(){ vP=vec2(c.x*uAsp,c.y)*0.5; gl_Position=vec4(c,0.0,1.0); }`,
`#version 300 es
precision highp float; in vec2 vP; out vec4 o; uniform vec3 uCol; uniform float uLight,uFloor,uTime;
${NOISE}
void main(){
  vec2 p=vP; vec3 c=mix(vec3(0.03,0.027,0.06),vec3(0.06,0.06,0.11),smoothstep(-0.5,0.5,p.y));
  float fl=step(p.y,uFloor);
  if(fl>0.5){ float d=uFloor-p.y+0.02; vec2 g=vec2(p.x/d*0.12,0.06/d+uTime*0.0);
    float gl=max(1.0-smoothstep(0.0,0.05,abs(fract(g.x)-0.5)*2.0-0.9),0.0);
    float line=smoothstep(0.96,1.0,abs(fract(g.x)-0.5)*2.0)+smoothstep(0.96,1.0,abs(fract(g.y)-0.5)*2.0);
    c=vec3(0.035,0.032,0.055)+line*0.025*smoothstep(0.0,0.3,d)*(1.0-smoothstep(0.3,0.6,d)); }

const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb)
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-.5, -.5, .5, -.5, -.5, .5, .5, .5]), gl.STATIC_DRAW)
const fb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, fb)
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW)
function ramp(stops) {

const maps = {}
const load = s => new Promise((ok, no) => { const im = new Image(); im.onload = () => {

let W = 0, H = 0
function size(w, h) { if (w === W && h === H) return; W = cv.width = hud.width = w; H = cv.height = hud.height = h }

    gl.uniform1f(FX.u.uNorm, l.norm ? 1 : 0)
