<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elemental Onslaught</title>
<style>
  :root { --bg: #04050a; --fg: #e8eef8; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { background: #10141f; color: var(--fg); border: 1px solid #2c3550; border-radius: 8px; padding: 8px 14px; font: inherit; }
  button:focus-visible { outline: 2px solid #8ab4ff; }
  #name { position: fixed; left: 16px; top: 16px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; opacity: 0; transition: opacity .2s; }
  #wipe { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #err { position: fixed; top: 40px; left: 0; right: 0; color: #ff8a8a; white-space: pre-wrap; margin: 8px; }
  h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<h1>Elemental Onslaught: a sorcerer unleashes poison, fire, darkness, light, rock and spellbooks</h1>
<div id="wipe"></div>
<div id="name"></div>
<div id="ui"><button id="play">Replay</button><button id="pause">Pause</button><span id="time"></span><span id="fps"></span></div>
<pre id="err"></pre>
<script type="module">
// 31 s cinematic. Every visual is a pure function of the global time T (renderAt(T)), so captures are exact.
// Attacks live in attacks/*.js (contract in lib.js); this file owns the caster, stage, timeline, camera, grade,
// wipes and the finale.
import { THREE, seg, easeOut, easeIn, backOut, bell, rng, canvasTex, softTex, puffTex, addMat, billboards, streaks, dummy, clamp } from './lib.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import * as poison from './attacks/poison.js';
import * as fire from './attacks/fire.js';
import * as darkness from './attacks/darkness.js';
import * as light from './attacks/light.js';
import * as rock from './attacks/rock.js';
import * as books from './attacks/books.js';

addEventListener('error', e => { document.getElementById('err').textContent = String(e.message); });
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = false;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#04050a'); scene.fog = new THREE.FogExp2('#04050a', 0.028);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 200);

const hemi = new THREE.HemisphereLight('#7f8fb0', '#0a0a10', 0.55); scene.add(hemi);
const keyL = new THREE.DirectionalLight('#c8d4ff', 0.9); keyL.position.set(-4, 8, 5); scene.add(keyL);
const rimL = new THREE.DirectionalLight('#ffffff', 0.0); rimL.position.set(2, 3, -6); scene.add(rimL);
const fxL = new THREE.PointLight('#fff', 0, 40, 1.4); scene.add(fxL);
const handL = new THREE.PointLight('#fff', 0, 6, 1.5); scene.add(handL);

// ---------- stage floor: worn flagstones (canvas texture), the ground every attack lands on
const R0 = rng(77);
const stoneTex = canvasTex(1024, (g, s) => {
  g.fillStyle = '#1b1c22'; g.fillRect(0, 0, s, s);
  const n = 8, c = s / n;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const v = 26 + R0(-6, 6) | 0; g.fillStyle = `rgb(${v},${v + 1},${v + 5})`;
    g.fillRect(x * c + 3, y * c + 3, c - 6, c - 6);
    for (let k = 0; k < 40; k++) { const w = R0(0, 0.08); g.fillStyle = `rgba(0,0,0,${w})`; g.fillRect(x * c + R0(0, c), y * c + R0(0, c), R0(4, 30), R0(1, 4)); }
  }
});
stoneTex.wrapS = stoneTex.wrapT = THREE.RepeatWrapping; stoneTex.repeat.set(10, 10);
const floor = new THREE.Mesh(new THREE.CircleGeometry(60, 96), new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.55, metalness: 0.15 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

// ---------- the caster: an original hooded sorcerer built from lathe profiles (robe, mantle, hood), sleeves, hands
const cloth = canvasTex(256, (g, s) => { g.fillStyle = '#2a2433'; g.fillRect(0, 0, s, s); const r = rng(5);
  for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(${r(0, 1) > .5 ? 255 : 0},${r(0, 1) > .5 ? 255 : 0},255,${r(0, 0.04)})`; g.fillRect(r(0, s), r(0, s), 1, r(2, 9)); }
  g.strokeStyle = 'rgba(200,170,90,.55)'; g.lineWidth = 6; g.beginPath(); g.moveTo(0, s - 14); g.lineTo(s, s - 14); g.stroke(); });
const robeMat = new THREE.MeshStandardMaterial({ map: cloth, roughness: 0.9, side: THREE.DoubleSide });
const trimMat = new THREE.MeshStandardMaterial({ color: '#b08a3a', metalness: 0.8, roughness: 0.35 });
const skinMat = new THREE.MeshStandardMaterial({ color: '#8a6a58', roughness: 0.7 });
const lathe = (pts, mat, seg = 40) => new THREE.Mesh(new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), seg), mat);
const caster = new THREE.Group(); scene.add(caster);
const robe = lathe([[0.62, 0], [0.58, 0.1], [0.46, 0.6], [0.34, 1.0], [0.27, 1.2], [0.24, 1.34], [0.2, 1.42]], robeMat, 56);
const inner = lathe([[0.55, 0.02], [0.43, 0.6], [0.31, 1.0]], new THREE.MeshStandardMaterial({ color: '#120f18', roughness: 1, side: THREE.BackSide }));
const belt = new THREE.Mesh(new THREE.TorusGeometry(0.33, 0.035, 10, 48), trimMat); belt.rotation.x = Math.PI / 2; belt.position.y = 0.98;
const buckle = new THREE.Mesh(new THREE.OctahedronGeometry(0.06), trimMat); buckle.position.set(0, 0.98, -0.34);
const mantle = lathe([[0.5, 1.12], [0.44, 1.24], [0.32, 1.38], [0.18, 1.48], [0.12, 1.5]], robeMat, 48);
const mantleTrim = new THREE.Mesh(new THREE.TorusGeometry(0.49, 0.02, 8, 64), trimMat); mantleTrim.rotation.x = Math.PI / 2; mantleTrim.position.y = 1.13;
const hood = lathe([[0.001, 1.92], [0.12, 1.9], [0.2, 1.83], [0.235, 1.7], [0.23, 1.58], [0.2, 1.48]], robeMat, 40);
const face = new THREE.Mesh(new THREE.SphereGeometry(0.15, 24, 16), new THREE.MeshBasicMaterial({ color: '#030306' }));
face.position.set(0, 1.68, -0.09); face.scale.set(1, 1.15, 0.8);
const eyes = [-1, 1].map(s => { const e = new THREE.Mesh(new THREE.SphereGeometry(0.018, 10, 8), addMat({ color: '#9fd0ff' })); e.position.set(0.05 * s, 1.7, -0.21); return e; });
const eyeGlow = billboards(scene, 2);
caster.add(robe, inner, belt, buckle, mantle, mantleTrim, hood, face, ...eyes);
// arms: shoulder pivot → sleeve (tapered, open cuff) → hand; right arm casts toward -Z
function makeArm(side) {
  const sh = new THREE.Group(); sh.position.set(0.27 * side, 1.38, 0);
  const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.075, 0.56, 16, 1, true), robeMat); sleeve.position.y = -0.28;
  const cuff = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.015, 8, 24), trimMat); cuff.rotation.x = Math.PI / 2; cuff.position.y = -0.56;
  const hand = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 12), skinMat); hand.position.y = -0.63; hand.scale.set(1, 1.3, 0.7);
  sh.add(sleeve, cuff, hand); caster.add(sh); return sh;
}
const armR = makeArm(1), armL = makeArm(-1);
const HAND = new THREE.Vector3(0.27, 1.38, -0.63); // right hand when the arm points straight at the target
const TARGET = new THREE.Vector3(0, 0, -12);

// ---------- timeline
const ctx = { scene, hand: HAND, target: TARGET, cam: camera };
const SEG = [
  { name: 'Venom Volley', mod: poison, at: 2.5, hue: '#7dff3a' },
  { name: 'Inferno Spiral', mod: fire, at: 6.5, hue: '#ff7a1a' },
  { name: 'Umbral Maw', mod: darkness, at: 10.5, hue: '#7a2cff' },
  { name: 'Radiant Judgement', mod: light, at: 14.5, hue: '#ffd98a' },
  { name: 'Tectonic Rage', mod: rock, at: 18.5, hue: '#ff8a3a' },
  { name: 'Grimoire Storm', mod: books, at: 22.7, hue: '#5ab0ff' },
];
for (const s of SEG) { s.fx = s.mod.create(ctx); s.color = new THREE.Color(s.hue); }
const FIN = 27.0, END = 31.5;

// ---------- caster aura: motes rising in the current hue
const aura = billboards(scene, 90);
const RA = rng(31); const AS = Array.from({ length: 90 }, () => ({ a: RA(0, 6.28), r: RA(0.4, 0.9), s: RA(0, 1), v: RA(0.5, 1.2) }));

// ---------- finale: six coloured orbs converge, then one beam, crack web + dome, sparks, residue
const RF = rng(4242);
const finOrbs = billboards(scene, 6 * 14);
const beamCore = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 24, 1, true), addMat({ color: '#ffffff' }));
const beamGlow = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 24, 1, true), addMat({ color: '#ffd98a', opacity: 0.35 }));
scene.add(beamCore, beamGlow);
const crackTex = canvasTex(512, (g, s) => {
  const pts = []; for (let i = 0; i < 60; i++) { const a = RF(0, 6.283), d = Math.sqrt(RF(0, 1)) * s * 0.5; pts.push([s / 2 + Math.cos(a) * d, s / 2 + Math.sin(a) * d]); }
  const img = g.createImageData(s, s);
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    let d1 = 1e9, d2 = 1e9; for (const [px, py] of pts) { const d = (x - px) ** 2 + (y - py) ** 2; if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d; }
    const e = Math.sqrt(d2) - Math.sqrt(d1), rr = Math.hypot(x - s / 2, y - s / 2) / (s / 2);
    const a = clamp(1 - e / Math.max(2.2 * (1.2 - rr), 0.7)) * clamp((1 - rr) * 3); const k = (y * s + x) * 4;
    img.data[k] = img.data[k + 1] = img.data[k + 2] = 255; img.data[k + 3] = a * 255;
  }
  g.putImageData(img, 0, 0);
});
const crack = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.ShaderMaterial({
  uniforms: { map: { value: crackTex }, uR: { value: 0 }, uA: { value: 0 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  polygonOffset: true, polygonOffsetFactor: -2,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D map; uniform float uR; uniform float uA; varying vec2 vUv;
    void main(){ float r = length(vUv - 0.5) * 2.0; float m = texture2D(map, vUv).a * smoothstep(uR, uR - 0.08, r);
      vec3 c = mix(vec3(1.0, 0.78, 0.4) * 1.6, vec3(1.8), smoothstep(uR - 0.3, uR, r));
      gl_FragColor = vec4(c * m * uA, 1.0); }` }));
crack.rotation.x = -Math.PI / 2; crack.position.set(TARGET.x, 0.02, TARGET.z); scene.add(crack);
const dome = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.ShaderMaterial({
  uniforms: { uA: { value: 0 }, uB: { value: 0 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: 'varying vec3 vN; varying vec3 vV; varying vec3 vP; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vP = position; vN = normalize(normalMatrix * normal); vV = normalize(-(viewMatrix * w).xyz); gl_Position = projectionMatrix * viewMatrix * w; }',
  fragmentShader: `uniform float uA; uniform float uB; varying vec3 vN; varying vec3 vV; varying vec3 vP;
    float h(vec3 p){ return fract(sin(dot(floor(p * 7.0), vec3(12.9898,78.233,37.719))) * 43758.5453); }
    void main(){ if (h(vP) < uB) discard; float f = pow(1.0 - abs(dot(vN, vV)), 2.5);
      gl_FragColor = vec4(mix(vec3(1.0,0.8,0.45), vec3(1.0), f) * (f * 1.5) * uA, 1.0); }` }));
dome.position.copy(TARGET); scene.add(dome);
const finSparks = streaks(scene, 260, 0.03);
const finSeed = Array.from({ length: 260 }, (_, i) => { const a = RF(0, 6.283), up = RF(0.1, 1.2); return { v: new THREE.Vector3(Math.cos(a), up, Math.sin(a)).normalize().multiplyScalar(RF(8, 20)), life: RF(0.4, 1.0), c: SEG[i % 6].color }; });
const finEmbers = billboards(scene, 160); const emSeed = Array.from({ length: 160 }, (_, i) => ({ x: RF(-5, 5), z: RF(-5, 5), t0: RF(0, 1.2), vy: RF(0.4, 1.4), c: SEG[i % 6].color }));
const HIT = 29.0;
function finale(T) {
  const lt = T - FIN, since = T - HIT; const tmp = new THREE.Vector3(); const out = { exposure: 1, shake: 0, light: 0, col: new THREE.Color('#ffd98a') };
  // 0-2: six streams of orbs spiral from around the caster into one core above the hand
  const coreP = new THREE.Vector3(0.27, 2.6, -0.9);
  for (let s = 0; s < 6; s++) for (let j = 0; j < 14; j++) { const i = s * 14 + j, k = seg(lt, 0.1 * s + j * 0.02, 1.7 + 0.03 * j);
    if (lt < 0 || since > 0 || k <= 0) { finOrbs.hide(i); continue; }
    const a = s * 1.047 + k * 5 + j * 0.05, r = 3.2 * (1 - easeOut(k));
    tmp.set(coreP.x + Math.cos(a) * r, coreP.y + Math.sin(k * 3 + s) * 0.6 * (1 - k), coreP.z + Math.sin(a) * r);
    finOrbs.set(i, tmp, (j ? 0.35 : 0.9) * (0.6 + 0.4 * k), SEG[s].color.clone().multiplyScalar(1.6), j ? 0.6 * (1 - j / 14) : 1); }
  finOrbs.commit();
  if (lt >= 0 && since < 0) { out.exposure = 1 - 0.4 * seg(lt, 0.4, 2.0); out.light = 10 * seg(lt, 0, 2); }
  // beam 29.0-30.0 from the core to the target
  const bk = since >= 0 && since < 1.0 ? (1 - seg(since, 0.55, 1.0)) * easeOut(seg(since, 0, 0.08)) : 0;
  for (const [m, w] of [[beamCore, 0.35], [beamGlow, 1.1]]) {
    m.visible = bk > 0; if (!bk) continue;
    const d = new THREE.Vector3().subVectors(TARGET, coreP); m.position.copy(coreP).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
    m.scale.set(w * bk * (1 + 0.08 * Math.sin(since * 60)), d.length(), w * bk * (1 + 0.08 * Math.sin(since * 60)));
  }
  crack.material.uniforms.uR.value = since < 0 ? 0 : 1.08 * easeOut(seg(since, 0.05, 0.4));
  crack.material.uniforms.uA.value = since < 0 ? 0 : 1 - seg(since, 1.2, 2.4);
  const dk = since < 0 ? 0 : easeOut(seg(since, 0.05, 0.4)); dome.scale.set(6 * dk + 0.01, 4.5 * dk + 0.01, 6 * dk + 0.01);
  dome.material.uniforms.uA.value = since < 0 ? 0 : 1 - seg(since, 0.35, 1.1); dome.material.uniforms.uB.value = seg(since, 0.3, 1.1);
  finSeed.forEach((s, i) => { const dt = since - 0.05, k = dt / s.life, on = dt >= 0 && k < 1;
    const dragT = (1 - Math.exp(-dt * 2.5)) / 2.5; dummy.position.set(TARGET.x + s.v.x * dragT, 0.4 + s.v.y * dragT - 4 * dt * dt, TARGET.z + s.v.z * dragT);
    dummy.position.y = Math.max(0.03, dummy.position.y); const vel = s.v.clone().multiplyScalar(Math.exp(-dt * 2.5)); vel.y -= 8 * dt;
    dummy.lookAt(dummy.position.clone().add(vel)); dummy.scale.set(1, 1, on ? 0.3 + vel.length() * 0.06 : 0); dummy.updateMatrix(); finSparks.setMatrixAt(i, dummy.matrix);
    finSparks.setColorAt(i, (k < 0.25 ? new THREE.Color('#ffffff') : s.c.clone()).multiplyScalar(2.2 * (1 - k))); });
  finSparks.instanceMatrix.needsUpdate = true; finSparks.instanceColor.needsUpdate = true;
  emSeed.forEach((e, i) => { const dt = since - 0.4 - e.t0, k = dt / 1.8; if (dt < 0 || k >= 1) { finEmbers.hide(i); return; }
    finEmbers.set(i, tmp.set(TARGET.x + e.x + Math.sin(dt * 2 + i) * 0.2, 0.1 + e.vy * dt, TARGET.z + e.z), 0.12, e.c.clone().multiplyScalar(1.5), bell(k)); });
  finEmbers.commit();
  if (since >= 0) { out.exposure = since < 0.06 && !reduced ? 1.9 : 1 + 0.35 * Math.exp(-since * 4); out.light = 60 * Math.exp(-since * 3); out.shake = bell(seg(since, 0, 0.9)); }
  return out;
}

// ---------- camera: shots chosen from the timeline, all pure functions of T
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function shot(T) {
  if (T < 2.5) { const k = easeOut(seg(T, 0, 2.5)); return [V(0.2, 1.0 + 0.5 * k, 7.5 - 2.5 * k), V(0, 1.45, 0)]; }
  for (let i = SEG.length - 1; i >= 0; i--) { const s = SEG[i]; if (T >= s.at && T < (SEG[i + 1]?.at ?? FIN)) {
    const lt = T - s.at, side = i % 2 ? -1 : 1;
    if (lt < 1.1) { const a = 0.6 * side + lt * 0.25 * side; return [V(Math.sin(a) * 4.3, 1.35, -Math.cos(a) * 4.3), V(0, 1.3, 0)]; } // front 3/4 on the caster, charge
    const k = seg(lt, 1.1, 4.2); return [V(2.3 * side, 2.7 + 0.5 * k, 6.2 - 1.2 * k), V(0, 1.2, -10)];                                   // over the shoulder to the hit zone
  } }
  const lt = T - FIN; if (T < HIT) { const k = seg(lt, 0, 2); return [V(4.5 - 1.2 * k, 1.6 + 0.8 * k, 2.5), V(0.2, 2.0, -1)]; }
  const k = easeOut(seg(T, HIT, END)); return [V(13 - 2 * k, 6 + 2 * k, 7 - 2 * k), V(0, 1.2, -7)];
}

const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.4, 0.88); composer.addPass(bloom);
composer.addPass(new OutputPass());
const wipe = document.getElementById('wipe'), nameEl = document.getElementById('name');

function activeSeg(T) { for (let i = SEG.length - 1; i >= 0; i--) if (T >= SEG[i].at) return i; return -1; }
function renderAt(T) {
  const ai = activeSeg(T), cur = ai >= 0 && T < FIN ? SEG[ai] : null;
  let exposure = 1, shake = 0, lightI = 0, lightC = new THREE.Color('#fff'), lightP = TARGET.clone();
  for (const s of SEG) { const r = s.fx.update(T - s.at); if (s === cur) { exposure = r.exposure; shake = r.shake; lightI = r.light.intensity; lightC.copy(r.light.color); lightP.copy(r.light.pos); } }
  const f = finale(T); if (T >= FIN) { exposure = f.exposure; shake = f.shake; lightI = f.light; lightC.copy(f.col); lightP.set(0, 3, -6); }
  if (T < 2.5) exposure = 0.55 + 0.45 * seg(T, 0, 1.2);
  if (T > END - 1.2) exposure *= 1 - 0.6 * seg(T, END - 1.2, END); // settle at the end
  renderer.toneMappingExposure = exposure; fxL.color.copy(lightC); fxL.intensity = lightI; fxL.position.copy(lightP);
  const hue = cur ? cur.color : T >= FIN ? new THREE.Color('#ffd98a') : new THREE.Color('#9fd0ff');
  // pose: right arm swings forward to cast during each attack and the finale; left arm braces
  const castK = cur ? easeOut(seg(T - cur.at, 0, 0.25)) * (1 - seg(T - cur.at, 3.9, 4.2)) : T >= FIN ? easeOut(seg(T, FIN, FIN + 0.3)) : 0;
  armR.rotation.x = -Math.PI / 2 * castK - 0.15 * (1 - castK) + (T >= FIN && T < HIT ? -0.6 * castK : 0); armR.rotation.z = 0.12 * (1 - castK);
  armL.rotation.x = -0.5 * castK; armL.rotation.z = -0.25 - 0.35 * castK;
  caster.position.y = 0.04 * Math.sin(T * 1.6) + (T < 2.5 ? 0 : 0.12 * seg(T, 2.5, 3.5)); // slight levitation once unleashed
  eyes.forEach(e => e.material.color.copy(hue).multiplyScalar(2));
  [-1, 1].forEach((s, i) => eyeGlow.set(i, V(0.05 * s, 1.7 + caster.position.y, -0.23), 0.12, hue, 0.9)); eyeGlow.commit();
  handL.color.copy(hue); handL.intensity = 3 + 4 * castK; handL.position.set(0.27, 1.38 + caster.position.y, -0.7);
  rimL.color.copy(hue); rimL.intensity = 1.6;
  AS.forEach((m, i) => { const k = (T * 0.35 * m.v + m.s) % 1; if (T < 0.8) { aura.hide(i); return; }
    aura.set(i, V(Math.cos(m.a + T * 0.6) * m.r, 0.1 + k * 2.2, Math.sin(m.a + T * 0.6) * m.r), 0.07, hue.clone().multiplyScalar(1.4), bell(k) * clamp((T - 0.8) / 1.2)); });
  aura.commit();
  // camera + shake (pure: shake from a hash of T)
  const [p, l] = shot(T); camera.position.copy(p); camera.lookAt(l);
  if (shake > 0 && !reduced) { const h = x => Math.sin(x * 12.9898) * 43758.5453 % 1; camera.position.x += 0.08 * shake * h(T * 91.1); camera.position.y += 0.08 * shake * h(T * 47.3); }
  // 1-frame hue wipe as each attack starts (cuts on action; 6 wipes in 24 s, far under 3 Hz)
  const w = SEG.find(s => T >= s.at - 0.05 && T < s.at);
  wipe.style.opacity = w && !reduced ? 1 : 0; if (w) wipe.style.background = w.hue;

camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
