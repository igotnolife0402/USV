<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
const V3=THREE.Vector3, Q=new URLSearchParams(location.search);
const W=+Q.get('w')||1280, H=+Q.get('h')||800, NS=Q.has('shells')?+Q.get('shells'):40;
// scene=1: ground, grass and foliage backdrop (only when the owner asks; needs tex.py). Default: the model alone on a plain backdrop.
const SCENE=Q.get('scene')==='1';
const VIEWS=(Q.get('views')||'hero').split(','), DEPTH=Q.get('depth')==='1', GRASS=SCENE&&Q.get('grass')!=='0';
const DIST=+Q.get('dist')||6, FOV=+Q.get('fov')||24, TX=Q.has('tx')?+Q.get('tx'):0.05, EXP=+Q.get('exp')||1.0;
const CELL=+Q.get('cell')||0.0021;
window.shots={}; window.info={};
const g2w=v=>new V3(v[1],v[2],v[0]);           // world (X fwd, Y left, Z up) -> gl
const W2G=(x,y,z)=>new V3(y,z,x);

async function bin(n,T){const r=await fetch('out/'+n);if(!r.ok)throw Error(n+' '+r.status);return new T(await r.arrayBuffer())}
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(i,j){let h=Math.imul(i,374761393)+Math.imul(j,668265263)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}
function vnoise(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
 const a=hash2(i,j),b=hash2(i+1,j),c=hash2(i,j+1),d=hash2(i+1,j+1);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy}
const yc=X=>0.10*Math.sin(0.35*X)+0.04*(Math.sin(0.9*X+0.5)-Math.sin(0.5));
const hw=X=>0.55+0.08*Math.sin(0.7*X+1.0);

async function main(){
 const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
 renderer.setPixelRatio(1); renderer.setSize(W,H,false); document.body.appendChild(renderer.domElement);
 renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=EXP;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(FOV,W/H,0.1,80);
 const hazy=new THREE.Color().setRGB(0.74,0.76,0.66,THREE.SRGBColorSpace);
 if(SCENE){scene.background=hazy; scene.fog=new THREE.Fog(hazy,8,40)}
 else scene.background=new THREE.Color().setRGB(0.78,0.79,0.80,THREE.SRGBColorSpace);

 // ---- tiger ----
 const [pos,nrm,col,idx,fur]=await Promise.all([bin('pos.bin',Float32Array),bin('nrm.bin',Float32Array),bin('col.bin',Float32Array),bin('idx.bin',Uint32Array),bin('fur.bin',Float32Array)]);
 const meta=await (await fetch('out/meta.json')).json();
 const geo=new THREE.BufferGeometry();
 geo.setAttribute('position',new THREE.BufferAttribute(pos,3)); geo.setAttribute('normal',new THREE.BufferAttribute(nrm,3));
 geo.setAttribute('color',new THREE.BufferAttribute(col,3)); geo.setAttribute('fur',new THREE.BufferAttribute(fur,4));
 geo.setIndex(new THREE.BufferAttribute(idx,1)); geo.computeBoundingSphere();
 const eyeC=meta.eyes.map(e=>new V3(...e.c)), eyeR=meta.eyes[0].r;

 const baseMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.85,metalness:0});
 baseMat.onBeforeCompile=s=>{
  s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nattribute vec4 fur;\nvarying float vFl;')
   .replace('#include <begin_vertex>','#include <begin_vertex>\nvFl=fur.w;');
  s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nvarying float vFl;')
   .replace('#include <color_fragment>','#include <color_fragment>\n'+(NS>0?'diffuseColor.rgb*=mix(1.0,0.45,smoothstep(0.0052,0.008,vFl));':''))
   .replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\nroughnessFactor=mix(0.42,roughnessFactor,smoothstep(0.0052,0.0062,vFl));');
 };
 const tiger=new THREE.Mesh(geo,baseMat); tiger.castShadow=true; tiger.receiveShadow=true; scene.add(tiger);

 let furMesh=null;
 if(NS>0){
  const furMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.85,metalness:0,alphaToCoverage:true});
  furMat.onBeforeCompile=s=>{
   s.uniforms.eyeC={value:eyeC}; s.uniforms.eyeR={value:eyeR};
   s.vertexShader=s.vertexShader.replace('#include <common>',`#include <common>
attribute vec4 fur; varying vec3 vObj; varying vec3 vNo; varying float vH; varying float vFl;`)
    .replace('#include <beginnormal_vertex>',`vec3 objectNormal = normalize(normal + fur.xyz*0.35);
#ifdef USE_TANGENT
 vec3 objectTangent = vec3( tangent.xyz );
#endif`)
    .replace('#include <begin_vertex>',`float fh=(float(gl_InstanceID)+1.0)/${NS}.0; vObj=position; vNo=normal; vH=fh; vFl=fur.w;
vec3 transformed = position + normal*fur.w*0.55*fh + fur.xyz*fur.w*0.85*pow(fh,1.5) - vec3(0.,1.,0.)*fur.w*0.12*fh*fh;`);
   s.fragmentShader=s.fragmentShader.replace('#include <common>',`#include <common>
varying vec3 vObj; varying vec3 vNo; varying float vH; varying float vFl; uniform vec3 eyeC[2]; uniform float eyeR;
vec3 hash33(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.xxy+p.yxx)*p.zyx);}
vec2 strands(vec3 P,vec3 N,float h,float seed){
 vec3 q=P/${CELL.toFixed(5)}+seed; vec3 b=floor(q-0.5); float best=9.0, rnd=0.0;
 for(int i=0;i<2;i++)for(int j=0;j<2;j++)for(int k=0;k<2;k++){
  vec3 c=b+vec3(float(i),float(j),float(k)); vec3 r=hash33(c); vec3 pt=c+0.5+(r-0.5)*0.8;
  vec3 d=pt-q; d-=N*dot(d,N);
  float L=0.55+0.45*r.z; float rad=0.62*pow(max(1.0-h/L,0.0),0.7);
  float m=length(d)/max(rad,1e-3); if(m<best){best=m;rnd=r.x;}
 }
 return vec2(best,rnd);
}`)
    .replace('#include <color_fragment>',`#include <color_fragment>
if(vFl<0.0056) discard;
if(min(distance(vObj,eyeC[0]),distance(vObj,eyeC[1]))<eyeR*1.55) discard;
vec3 Nn=normalize(vNo);
vec2 s1=strands(vObj,Nn,vH,0.0), s2=strands(vObj,Nn,vH,17.31); vec2 sb=s1.x<s2.x?s1:s2;
float fa=smoothstep(1.0,0.75,sb.x); if(fa<0.02) discard;
diffuseColor.a=fa; diffuseColor.rgb*=(0.88+0.24*sb.y)*mix(0.55,1.0,vH);`);
  };
  furMesh=new THREE.InstancedMesh(geo,furMat,NS); const I=new THREE.Matrix4();
  for(let i=0;i<NS;i++) furMesh.setMatrixAt(i,I);
  furMesh.frustumCulled=false; furMesh.receiveShadow=true; furMesh.castShadow=false; scene.add(furMesh);
 }

 // eyes: procedural iris in the fragment shader, +Z = gaze
 const eyeMat=new THREE.MeshPhysicalMaterial({roughness:0.35,clearcoat:1,clearcoatRoughness:0.02});
 eyeMat.onBeforeCompile=s=>{
  s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vLP;').replace('#include <begin_vertex>','#include <begin_vertex>\nvLP=position;');
  s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vLP;')
   .replace('#include <color_fragment>',`#include <color_fragment>
vec3 lp=normalize(vLP); float ea=acos(clamp(lp.z,-1.0,1.0)); float ph=atan(lp.y,lp.x); float it=clamp((ea-0.24)/0.42,0.0,1.0);
vec3 iris=mix(vec3(0.75,0.42,0.06),vec3(0.55,0.28,0.04),it)*(1.0+0.15*sin(23.0*ph)+0.08*sin(57.0*ph+3.0*it));
iris*=mix(0.55,1.0,smoothstep(0.24,0.33,ea));
vec3 ec=mix(vec3(0.01),iris,smoothstep(0.232,0.248,ea));
ec=mix(ec,vec3(0.08,0.05,0.02),smoothstep(0.63,0.67,ea));
ec=mix(ec,vec3(0.03,0.025,0.02),smoothstep(0.70,0.73,ea));
diffuseColor.rgb=ec;`);
 };
 const eyeGeo=new THREE.SphereGeometry(eyeR,48,32); eyeGeo.rotateX(Math.PI/2);
 const eyes=eyeC.map(c=>{const m=new THREE.Mesh(eyeGeo,eyeMat);m.position.copy(c);scene.add(m);return m});
 const R=meta.headR, headFwd=new V3(R[1][0],R[2][0],R[0][0]).normalize();
 function aimEyes(cp){eyes.forEach(m=>{const d=cp.clone().sub(m.position).normalize(),a=Math.acos(Math.min(1,d.dot(headFwd))),mx=30*Math.PI/180;
  let g=d; if(a>mx){const q=new THREE.Quaternion().setFromUnitVectors(headFwd,d);g=headFwd.clone().applyQuaternion(new THREE.Quaternion().slerp(q,mx/a))}
  m.quaternion.setFromUnitVectors(new V3(0,0,1),g.normalize())})}

 // whiskers: tapered drooping tubes
 {const SEG=12,RV=5,R0=0.0007,P=[],N=[],I=[];
  for(const w of meta.whiskers){const p=new V3(...w.p),d=new V3(...w.d).normalize(),L=w.l*1.35,b=P.length/3,pts=[];
   for(let s=0;s<=SEG;s++){const t=s/SEG;pts.push(p.clone().addScaledVector(d,L*t).add(new V3(0,-0.25*L*t*t,0)))}
   for(let s=0;s<=SEG;s++){const t=s/SEG,tn=(s<SEG?pts[s+1].clone().sub(pts[s]):pts[s].clone().sub(pts[s-1])).normalize();
    const n1=new V3().crossVectors(tn,Math.abs(tn.y)<0.9?new V3(0,1,0):new V3(1,0,0)).normalize(),n2=new V3().crossVectors(tn,n1),r=R0*(1-0.85*t);
    for(let k=0;k<RV;k++){const a=k/RV*Math.PI*2,n=n1.clone().multiplyScalar(Math.cos(a)).addScaledVector(n2,Math.sin(a));P.push(...pts[s].clone().addScaledVector(n,r).toArray());N.push(...n.toArray())}}
   for(let s=0;s<SEG;s++)for(let k=0;k<RV;k++){const a=b+s*RV+k,c=b+s*RV+(k+1)%RV;I.push(a,a+RV,c,c,a+RV,c+RV)}}
  const wg=new THREE.BufferGeometry();wg.setAttribute('position',new THREE.Float32BufferAttribute(P,3));wg.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));wg.setIndex(I);
  scene.add(new THREE.Mesh(wg,new THREE.MeshStandardMaterial({color:new THREE.Color('#f2efe8'),roughness:0.4})))}

 // ---- environment ----
 if(!SCENE){ // shadow only: the model stands on the backdrop, nothing else is built
  const sc=new THREE.Mesh(new THREE.PlaneGeometry(12,12).rotateX(-Math.PI/2),new THREE.ShadowMaterial({opacity:0.3})); sc.receiveShadow=true; scene.add(sc);
 } else {
 const tl=new THREE.TextureLoader(), maxAn=renderer.capabilities.getMaxAnisotropy();
 const [gTex,gN,gFar,det,fol]=await Promise.all(['ground.jpg','groundn.png','groundfar.jpg','detail.jpg','foliage.jpg'].map(f=>tl.loadAsync(f)));
 for(const t of [gTex,gFar,fol]) t.colorSpace=THREE.SRGBColorSpace;
 for(const t of [gTex,gN,gFar]) t.anisotropy=maxAn;
 det.wrapS=det.wrapT=THREE.RepeatWrapping; det.anisotropy=maxAn;
 const gMat=new THREE.MeshStandardMaterial({map:gTex,normalMap:gN,roughness:0.95,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-4});
 gMat.onBeforeCompile=s=>{s.uniforms.detailMap={value:det};
  s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWP;').replace('#include <begin_vertex>','#include <begin_vertex>\nvWP=(modelMatrix*vec4(transformed,1.0)).xyz;');
  s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vWP; uniform sampler2D detailMap;')
   .replace('#include <map_fragment>','#include <map_fragment>\ndiffuseColor.rgb*=2.0*texture2D(detailMap,vWP.xz/0.6).r;');};
 const gnd=new THREE.Mesh(new THREE.PlaneGeometry(12,12).rotateX(-Math.PI/2),gMat); gnd.receiveShadow=true; scene.add(gnd);
 const far=new THREE.Mesh(new THREE.PlaneGeometry(96,96).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({map:gFar,roughness:0.95}));
 far.position.y=-0.005; far.receiveShadow=true; scene.add(far);
 const bg=new THREE.Mesh(new THREE.CylinderGeometry(15,15,8,128,1,true),new THREE.MeshBasicMaterial({map:fol,side:THREE.BackSide}));
 bg.position.y=3.5; scene.add(bg);
 }

 const TGT=W2G(TX,0,0.55);
 const sunDir=W2G(0.79,0.21,0.57).normalize();
 const sun=new THREE.DirectionalLight(new THREE.Color(1,0.88,0.72),3);
 sun.position.copy(TGT).addScaledVector(sunDir,20); sun.target.position.copy(TGT); scene.add(sun,sun.target);
 sun.castShadow=true; sun.shadow.mapSize.set(4096,4096);
 Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:1,far:40}); sun.shadow.bias=-0.0003; sun.shadow.normalBias=0.015;
 scene.add(new THREE.HemisphereLight(new THREE.Color(0.6,0.7,0.85),new THREE.Color(0.35,0.3,0.2),0.35));
 {const es=new THREE.Scene(),sg=new THREE.SphereGeometry(10,64,32),c=[];
  for(let i=0;i<sg.attributes.position.count;i++){const y=sg.attributes.position.getY(i)/10,t=Math.max(0,y);
   const top=[0.35,0.55,0.95],hor=[1.0,0.92,0.78],gr=[0.25,0.22,0.15];
   const k=y>=0?top.map((v,j)=>hor[j]+(v-hor[j])*Math.pow(t,0.6)):gr;c.push(...k.map(v=>v*1.2))}
  sg.setAttribute('color',new THREE.Float32BufferAttribute(c,3));
  es.add(new THREE.Mesh(sg,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
  const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromScene(es,0.02).texture; scene.environmentIntensity=0.5;}

 // ---- grass ----
 const bladeGeo=(()=>{const S=5,P=[],N=[],C=[],I=[];
  for(const side of [1,-1]){const b=P.length/3;
   for(let s=0;s<=S;s++){const t=s/S,h=0.5*Math.pow(1-t,0.8),z=0.35*t*t,c=0.35+0.65*t;
    for(const x of [-h,h]){P.push(x,t,z);N.push(0,0.75,0.66*side);C.push(c,c,c)}}
   for(let s=0;s<S;s++){const a=b+s*2; if(side>0)I.push(a,a+1,a+2,a+1,a+3,a+2); else I.push(a,a+2,a+1,a+1,a+2,a+3)}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));g.setIndex(I);return g})();
 const grassMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.75});
 const GC=[[0.72,0.62,0.40,0.40],[0.55,0.55,0.30,0.30],[0.38,0.45,0.20,0.15],[0.45,0.35,0.22,0.15]].map(a=>[new THREE.Color().setRGB(a[0],a[1],a[2],THREE.SRGBColorSpace),a[3]]);
 let grass=null;
 function buildGrass(camW,tgtW){ // world coords
  if(grass){scene.remove(grass);grass.dispose()}
  const rnd=mulberry32(1234),hc=camW.z,Cx=camW.x,Cy=camW.y,vd=Math.atan2(tgtW.y-Cy,tgtW.x-Cx);
  const hf=Math.atan(Math.tan(FOV*Math.PI/360)*W/H)+6*Math.PI/180;
  const bands=[[1.2,9,2500],[9,16,900]],M=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),sc=new V3(),tp=new V3(),list=[];
  for(const [r0,r1,den] of bands){const n=Math.round(den*hf*(r1*r1-r0*r0));
   for(let i=0;i<n;i++){const r=Math.sqrt(rnd()*(r1*r1-r0*r0)+r0*r0),th=vd+(rnd()*2-1)*hf,X=Cx+r*Math.cos(th),Y=Cy+r*Math.sin(th);
    if(Math.abs(X)>40||Math.abs(Y)>40)continue;
    const dd=Math.abs(Y-yc(X))-hw(X); let h=(0.18+0.35*Math.pow(rnd(),1.5))*(0.55+0.9*vnoise(X/0.7,Y/0.7));
    if(dd<-0.05){if(rnd()>0.4)continue;h=0.03+0.07*rnd()}
    else if(dd<0.45)h*=0.3+0.7*Math.min(1,(dd+0.05)/0.5);
    if(Cy>1&&Y<yc(X)-hw(X))h*=1.6;
    if((Cy>0&&Y>0&&Y<Cy)||(Cy<0&&Y<0&&Y>Cy)){const s=Cy/(Cy-Y),hx=Cx+s*(X-Cx);
     if(hx>-1.4&&hx<1.6)h=Math.min(h,0.9*hc*(1-1/s)+0.01)}
    const u=rnd();let ci=0,acc=0;for(;ci<3;ci++){acc+=GC[ci][1];if(u<acc)break}
    const w=0.008+0.006*rnd();
    list.push([X,Y,h,w,rnd()*Math.PI*2,(rnd()-0.5)*0.5,ci,0.85+0.3*rnd()])}}
  grass=new THREE.InstancedMesh(bladeGeo,grassMat,list.length);const cc=new THREE.Color();
  list.forEach(([X,Y,h,w,ry,rx,ci,br],i)=>{tp.set(Y,0,X);q.setFromEuler(e.set(rx,ry,0,'YXZ'));sc.set(w,h,h);M.compose(tp,q,sc);grass.setMatrixAt(i,M);
   grass.setColorAt(i,cc.copy(GC[ci][0]).multiplyScalar(br))});
  grass.castShadow=true;grass.receiveShadow=true;scene.add(grass);return list.length}

 // ---- depth pass ----
 const depthMat=new THREE.ShaderMaterial({vertexShader:`varying float vD;void main(){vec4 p=vec4(position,1.0);
#ifdef USE_INSTANCING
 p=instanceMatrix*p;
#endif
 vec4 mv=modelViewMatrix*p;vD=-mv.z/64.0;gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying float vD;void main(){float v=floor(clamp(vD,0.0,1.0)*16777215.0);float r=floor(v/65536.0);float g=floor((v-r*65536.0)/256.0);float b=v-r*65536.0-g*256.0;gl_FragColor=vec4(r,g,b,255.0)/255.0;}`});
 function depthShot(){const rt=new THREE.WebGLRenderTarget(W,H);const bgk=scene.background,fg=scene.fog;
  scene.background=null;scene.fog=null;scene.overrideMaterial=depthMat;if(furMesh)furMesh.visible=false;renderer.setClearColor(0xffffff,1);
  renderer.setRenderTarget(rt);renderer.clear();renderer.render(scene,camera);const buf=new Uint8Array(W*H*4);renderer.readRenderTargetPixels(rt,0,0,W,H,buf);
  renderer.setRenderTarget(null);scene.overrideMaterial=null;scene.background=bgk;scene.fog=fg;if(furMesh)furMesh.visible=true;rt.dispose();
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d'),im=cx.createImageData(W,H);
  for(let y=0;y<H;y++)im.data.set(buf.subarray((H-1-y)*W*4,(H-y)*W*4),y*W*4);cx.putImageData(im,0,0);return cv.toDataURL('image/png')}

 // ---- views (az from world +X toward +Y, z = absolute height) ----
 const HEAD=[1.1,0,0.9];
 const VW={hero:{az:60,d:DIST,z:0.7,t:[TX,0,0.55]},side:{az:90,d:6,z:0.6,t:[0.05,0,0.55]},front:{az:0,d:4,z:0.9,t:[1.1,0,0.75]},
  top:{top:1,d:8,t:[0.05,0,0]},face:{az:45,d:1.4,z:0.95,t:HEAD},back:{az:200,d:5,z:0.8,t:[0.05,0,0.55]}};
 const pv=new V3();
 for(const name of VIEWS){const v=VW[name];if(!v)throw Error('view '+name);const t=v.t;
  let cw; if(v.top){cw=[t[0],t[1],v.d];camera.up.set(0,0,1)}else{const a=v.az*Math.PI/180;cw=[t[0]+v.d*Math.cos(a),t[1]+v.d*Math.sin(a),v.z];camera.up.set(0,1,0)}
  camera.position.copy(W2G(...cw));camera.lookAt(W2G(...t));camera.updateMatrixWorld();camera.updateProjectionMatrix();
  aimEyes(camera.position);
  let nb=0;if(GRASS)nb=buildGrass({x:cw[0],y:cw[1],z:cw[2]},{x:t[0],y:t[1]});
  const t0=performance.now();renderer.render(scene,camera);shots[name]=renderer.domElement.toDataURL('image/png');
  let x0=1,x1=-1,y0=1,y1=-1;for(let i=0;i<pos.length/3;i+=50){pv.set(pos[i*3],pos[i*3+1],pos[i*3+2]).project(camera);x0=Math.min(x0,pv.x);x1=Math.max(x1,pv.x);y0=Math.min(y0,pv.y);y1=Math.max(y1,pv.y)}
  info[name]={ms:Math.round(performance.now()-t0),blades:nb,bbox:[(x0+1)/2,(1-y1)/2,(x1+1)/2,(1-y0)/2].map(v=>+v.toFixed(3)),
   focus:+camera.position.distanceTo(eyeC[0].clone().add(eyeC[1]).multiplyScalar(0.5)).toFixed(3)};
  if(DEPTH)shots[name+'_depth']=depthShot()}
}
main().then(()=>window.done=1,e=>window.fail=String(e&&e.stack||e));
</script></body></html>
