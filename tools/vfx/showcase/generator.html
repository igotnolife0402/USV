<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VFX Generator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<style>
/* VFX Generator (owner 2026-11-25): type the exact animation, Claude writes a showcase spec, this page builds and plays it
   with the same pipeline as tools/vfx/showcase/build.mjs: newest white sheets (vfx/sheets) painted by gradient map,
   Studio's cinePass (push-in, slow-mo, hit-stop, dip, flash, shake, grade) and cineLights (impact + rim lights). */
:root{--bg:#07080c;--panel:#10131a;--panel2:#171b24;--line:#262c39;--fg:#e9edf5;--mute:#8d97aa;--accent:#a98bff;--bad:#ff7a7a;--ok:#7be0a4;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:1180px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left));display:grid;gap:14px}
h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.01em}
h1 small{font-weight:400;color:var(--mute);font-size:13px;margin-left:8px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.stage{position:relative;background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:16/9}
.stage canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:10px;top:8px;font:12px ui-monospace,Menlo,monospace;color:#cfd6e4b3;pointer-events:none;text-shadow:0 1px 2px #000}
.load{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:13px;pointer-events:none}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#120c22;font-weight:650}
.scrub{position:relative;flex:1 1 200px;min-width:160px;height:28px}
.scrub input{width:100%;height:28px;margin:0;accent-color:var(--accent)}
.scrub .pay{position:absolute;top:2px;width:2px;height:24px;background:#fff;border-radius:1px;pointer-events:none;opacity:.8}
.time{font:12px ui-monospace,Menlo,monospace;color:var(--mute);min-width:96px;text-align:right}
.side{display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.card h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
textarea{width:100%;min-height:150px;resize:vertical;font:13px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px}
textarea.code{font:12px/1.4 ui-monospace,Menlo,monospace;min-height:260px;white-space:pre}
.status{font-size:12.5px;color:var(--mute);white-space:pre-wrap;max-height:180px;overflow:auto}
.status.bad{color:var(--bad)}.status.ok{color:var(--ok)}
details summary{cursor:pointer;color:var(--mute);font-size:12.5px}
.meta{font-size:12px;color:var(--mute)}
pre.err{margin:0;color:var(--bad);font-size:12px;white-space:pre-wrap}
.msg{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:calc(100% - 24px);padding:7px 12px;border-radius:8px;background:#0b0d13e6;border:1px solid var(--line);font-size:13px;white-space:pre-wrap;pointer-events:none}
.msg.bad{color:var(--bad);border-color:#ff7a7a66}.msg.ok{color:var(--ok)}
.tag{position:absolute;right:10px;top:8px;font:600 11px system-ui;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:#ffffff1a;color:#cfd6e4;pointer-events:none}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.sheets figure{margin:0;display:grid;gap:4px}.sheets img{width:100%;aspect-ratio:1;background:#000;border-radius:6px;border:1px solid var(--line)}
.sheets figcaption{font-size:11px;color:var(--mute);overflow-wrap:anywhere}
pre.code{margin:0;font:11.5px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:#cfd6e4;background:var(--panel2);border-radius:8px;padding:8px;max-height:260px;overflow:auto}
</style>
</head>
<body>
<div class="app">
  <h1>VFX Generator<small>prompt → Claude writes the sheet scripts → new white sheets → painted anim.cine clip</small></h1>
  <div class="grid">
    <div style="display:grid;gap:10px">
      <div class="stage" id="stage"><div class="hud" id="hud"></div><div class="load" id="load">Loading…</div><div class="tag" id="tag"></div><div class="msg" id="msg" hidden></div></div>
      <div class="bar">
        <button id="play" type="button">Pause</button>
        <button id="restart" type="button">Restart</button>
        <div class="scrub"><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline"><div class="pay" id="pay"></div></div>
        <span class="time" id="time">0.00 / 0.00</span>
      </div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="side">
      <div class="card">
        <h2>Your animation</h2>
        <textarea id="prompt" placeholder="Describe the exact animation: the caster or object, what charges, each hit in order, the payoff, colours, camera feel, how it settles…"></textarea>
        <div class="bar"><button class="primary" id="gen" type="button">Generate</button><button id="stop" type="button" hidden>Stop</button></div>
        <div class="status" id="status"></div>
      </div>
      <div class="card" id="sheetsCard" hidden>
        <h2>New sheets (written this run)</h2>
        <div class="sheets" id="sheets"></div>
        <details><summary>Sheet scripts</summary><pre class="code" id="scripts"></pre></details>
      </div>
      <div class="card">
        <details id="specBox"><summary>Spec JSON (edit, then Apply)</summary>
          <textarea class="code" id="spec" spellcheck="false"></textarea>
          <div class="bar" style="margin-top:8px"><button id="apply" type="button">Apply</button><button id="dl" type="button">Download spec.json</button></div>
        </details>
      </div>
    </div>
  </div>
</div>
<script type="module">
import * as THREE from 'three'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
// Studio's own code, vendored unchanged in lib/: the same sampler, cine pass and flipbook renderer the showcase clip used.
import { sample, storyAt } from './lib/sample.js'
import { cinePass, cineLights, CINE } from './lib/cine.js'
import VFX from './lib/vfx.js'
// the library's own sheet method (the stylized unique.py), ported: Claude's scripts are drawn by it into NEW white sheets
import { makeSheet, EL } from './lib/ugen.js'

const LIB = '../../../vfx/', $ = id => document.getElementById(id)
// status shows in the side panel AND on the stage (on a phone the panel sits below the fold)
const status = (msg, cls = '') => { const s = $('status'); s.textContent = msg; s.className = 'status ' + cls; const m = $('msg'); m.hidden = !msg; m.textContent = msg; m.className = 'msg ' + cls; if (cls === 'ok') setTimeout(() => { if (m.textContent === msg) m.hidden = true }, 4000) }
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } }

// ---------- paint (port of tools/vfx/paint.py): light = sheet alpha -> ramp edge->core, texture multiplied inside the alpha
const RAMPS = {
  fire: '#7a1010,#ff4a12,#ffa21f,#ffe7a0,#ffffff', ice: '#123a8a,#2f8cff,#7fd8ff,#dff8ff,#ffffff',
  electric: '#3a1a9e,#6a5cff,#6ac8ff,#e0f6ff,#ffffff', poison: '#1f4a12,#3fa22a,#9be04a,#e6ffc0,#ffffff',
  holy: '#8a5a00,#ffb21f,#ffe066,#fff8d6,#ffffff', void: '#12001f,#3a0a5e,#7a2fd0,#c79bff,#f2e6ff',
  blood: '#2a0006,#7a0010,#c41a22,#ff6a5a,#ffd6d0', wind: '#5f8a96,#9fd2d8,#d6f2f0,#f4fffd,#ffffff'
}
const HEX = /^#[0-9a-f]{6}$/i
const rampStops = r => (RAMPS[r] || r || '').split(',').map(s => s.trim())
const validRamp = r => { const s = rampStops(r); return s.length >= 2 && s.every(x => HEX.test(x)) }
function lut(r) {
  const st = rampStops(r).map(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16))), out = new Uint8ClampedArray(256 * 3), n = st.length - 1
  for (let i = 0; i < 256; i++) { const x = i / 255 * n, k = Math.min(n - 1, Math.floor(x)), f = x - k; for (let c = 0; c < 3; c++) out[i * 3 + c] = st[k][c] + (st[k + 1][c] - st[k][c]) * f }
  return out
}
function hash(x, y, s) { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296 }
function vnoise(u, v, f, s) {                       // tileable value noise on the unit square, period f
  const x = u * f, y = v * f, x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy)
  const g = (i, j) => hash(((i % f) + f) % f, ((j % f) + f) % f, s)
  return (g(x0, y0) * (1 - sx) + g(x0 + 1, y0) * sx) * (1 - sy) + (g(x0, y0 + 1) * (1 - sx) + g(x0 + 1, y0 + 1) * sx) * sy
}
const texCache = new Map()
function texField(kind, cs) {                      // one cell's texture (0..1), tiled once per grid cell like paint.py
  const key = kind + cs; if (texCache.has(key)) return texCache.get(key)
  const t = new Float32Array(cs * cs)
  const pts = kind === 'cells' ? Array.from({ length: 12 }, (_, i) => [hash(i, 1, 7), hash(i, 2, 7)]) : null
  for (let y = 0; y < cs; y++) for (let x = 0; x < cs; x++) {
    const u = x / cs, v = y / cs; let val
    if (kind === 'cells') {
      let d1 = 9, d2 = 9
      for (const p of pts) for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) { const d = Math.hypot(u - p[0] - ox, v - p[1] - oy); if (d < d1) { d2 = d1; d1 = d } else if (d < d2) d2 = d }
      val = Math.min(1, (d2 - d1) * 6)
    } else if (kind === 'streaks') val = 0.6 * vnoise(u, v * 0.0625 + 0.5, 32, 3) + 0.4 * vnoise(u, v, 8, 4)
    else val = 0.5 * vnoise(u, v, 8, 1) + 0.3 * vnoise(u, v, 16, 2) + 0.2 * vnoise(u, v, 32, 3)
    t[y * cs + x] = val
  }
  texCache.set(key, t); return t
}
// generated sheets: key 'gen|<hash of code+seed>' -> Promise<{url, jump, empty}> from ugen.makeSheet
const GEN = new Map()
const hashStr = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return (h >>> 0).toString(36) }
const genKey = d => 'gen|' + hashStr(d.code + '|' + (d.seed ?? 1125))
const imgCache = new Map()
const loadImg = slug => imgCache.get(slug) || imgCache.set(slug, (slug.startsWith('gen|') ? GEN.get(slug).then(r => r.url) : Promise.resolve(LIB + 'sheets/' + slug + '.png')).then(src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('sheet missing: ' + slug)); i.src = src }))).get(slug)
// draw every script in S.sheets (sequential, cached); throws naming the sheet whose script broke
async function renderSheets(S, say = () => {}) {
  const ids = Object.keys(S.sheets || {}), out = {}
  for (const [n, id] of ids.entries()) {
    const d = S.sheets[id], k = genKey(d)
    if (!GEN.has(k)) { say(`Drawing new sheet ${n + 1}/${ids.length}: ${id}…`); GEN.set(k, makeSheet(d.code, d.seed ?? 1125)) }
    try { out[id] = await GEN.get(k) } catch (e) { GEN.delete(k); throw new Error(`sheet "${id}": ${e.message}`) }
    if (out[id].empty > 4) { GEN.delete(k); throw new Error(`sheet "${id}": ${out[id].empty} of 16 frames are empty (draw from t≈0.05, the wrapper erodes it after 0.55)`) }
  }
  return out
}
function showSheets(S, res) {
  const ids = Object.keys(S.sheets || {}); $('sheetsCard').hidden = !ids.length; $('sheets').replaceChildren()
  for (const id of ids) { const f = document.createElement('figure'), i = new Image(), c = document.createElement('figcaption'); i.src = res[id].url; i.alt = 'generated sheet ' + id; c.textContent = `${id} · jump ${res[id].jump}`; f.append(i, c); $('sheets').append(f) }
  $('scripts').textContent = ids.map(id => `// ${id} (seed ${S.sheets[id].seed ?? 1125})\n${S.sheets[id].code}`).join('\n\n')
}
const painted = new Map()                          // tex id -> Promise<blob url>
function paint(slug, grid, ramp, tex, amt) {
  const id = ['fx', slug, ramp, tex, amt].join('|')
  if (!painted.has(id)) painted.set(id, loadImg(slug).then(img => {
    const W = img.naturalWidth, H = img.naturalHeight, cv = document.createElement('canvas'); cv.width = W; cv.height = H
    const cx = cv.getContext('2d', { willReadFrequently: true }); cx.drawImage(img, 0, 0)
    const d = cx.getImageData(0, 0, W, H), p = d.data, L = lut(ramp), cs = Math.max(1, Math.round(W / grid)), T = tex !== 'none' ? texField(tex, cs) : null
    for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i += 4) {
      let l = p[i + 3] / 255
      if (T && l > 0) l = Math.min(1, l * Math.min(1.4, Math.max(0, 1 - amt + amt * 2 * T[(y % cs) * cs + (x % cs)])))
      const k = Math.round(l * 255) * 3
      p[i] = L[k]; p[i + 1] = L[k + 1]; p[i + 2] = L[k + 2]; p[i + 3] = Math.min(255, l * 1.15 * 255)
    }
    cx.putImageData(d, 0, 0)
    return new Promise(r => cv.toBlob(b => r(URL.createObjectURL(b)), 'image/png'))
  }))
  return id
}

// ---------- the sheet catalog (vfx/index.tsv: slug name kind grid frames life src)
let INDEX = {}
async function loadIndex() {
  const t = await (await fetch(LIB + 'index.tsv')).text()
  for (const l of t.trim().split('\n').slice(1)) { const r = l.split('\t'); INDEX[r[0]] = { name: r[1], kind: r[2], grid: +r[3], frames: +r[4], life: +r[5] } }
}

// ---------- validate (build.mjs rules + the showcase floor)
const SHAPES = ['box', 'cylinder', 'sphere', 'cone', 'torus', 'plane']
const vec = (v, n = 3) => Array.isArray(v) && v.length === n && v.every(x => typeof x === 'number' && isFinite(x))
function validate(S) {
  const bad = []
  if (!S || typeof S !== 'object') return ['spec is not an object']
  const L = S.len
  if (!(L >= 3 && L <= 30)) bad.push('len must be 3..30 s')
  if (!(S.payoff > 0 && S.payoff < L)) bad.push('payoff must be inside 0..len')
  if (S.cine_kind && !(S.cine_kind in CINE) || S.cine_kind === 'loop') bad.push('cine_kind must be impact or burst')
  if (!HEX.test(S.tint || '')) bad.push('tint must be #rrggbb')
  if (!S.camera || !vec(S.camera.pos) || !vec(S.camera.target)) bad.push('camera needs pos and target [x,y,z]')
  const parts = S.parts || {}
  for (const [k, p] of Object.entries(parts)) {
    if (!SHAPES.includes(p.shape || 'box')) bad.push(`part ${k}: shape ${p.shape}`)
    if (!vec(p.size)) bad.push(`part ${k}: size [x,y,z]`)
    if (p.pos && !vec(p.pos)) bad.push(`part ${k}: pos`)
    if (p.parent && !parts[p.parent]) bad.push(`part ${k}: parent ${p.parent} missing`)
  }
  for (const [k, tr] of Object.entries(S.tracks || {})) {
    if (!parts[k]) { bad.push(`track ${k}: no such part`); continue }
    for (const [ch, ks] of Object.entries(tr)) {
      if (!['pos', 'rot', 'scale'].includes(ch)) bad.push(`track ${k}.${ch}: only pos/rot/scale`)
      else if (!Array.isArray(ks) || !ks.every(q => typeof q[0] === 'number' && vec(q[1]))) bad.push(`track ${k}.${ch}: keys [t,[x,y,z],ease]`)
    }
  }
  const fx = S.fx || []
  for (const [id, d] of Object.entries(S.sheets || {})) if (typeof d?.code !== 'string' || !d.code.trim()) bad.push(`sheet ${id}: code (the draw script) missing`)
  if (fx.length < 3 || fx.length > 40) bad.push('fx count must be 3..40')
  fx.forEach((e, i) => {
    const m = e.sheet ? S.sheets?.[e.sheet] : INDEX[e.slug], tag = `fx[${i}] ${e.sheet || e.slug}`
    if (!m) return bad.push(e.sheet ? `${tag}: no sheets.${e.sheet} script` : `${tag}: no such sheet`)
    const dur = 'dur' in e ? e.dur : (e.life ?? (e.sheet ? m.life ?? 0.9 : 0.6))
    if (!(e.t >= 0) || e.t + dur > L + 1e-6) bad.push(`${tag}: ${e.t}+${dur} leaves 0-${L}`)
    if (!vec(e.pos)) bad.push(`${tag}: pos [x,y,z]`)
    if (!(e.size > 0)) bad.push(`${tag}: size`)
    if (e.parent && !parts[e.parent]) bad.push(`${tag}: parent ${e.parent} missing`)
    if (!validRamp(e.ramp)) bad.push(`${tag}: ramp must be a preset (${Object.keys(RAMPS).join(', ')}) or "#hex,#hex,..."`)
    if (e.shape === 'beam' && !(e.length > 0)) bad.push(`${tag}: beam needs length`)
  })
  const ims = S.impacts || []
  if (ims.filter(i => i.payoff).length !== 1) bad.push('exactly one impact needs payoff:true')
  ims.forEach((im, i) => { if (!vec(im.at) || !(im.t >= 0 && im.t <= L)) bad.push(`impact ${i}: t inside len and at [x,y,z]`) })
  return bad
}

// ---------- build (build.mjs logic, then Studio's cinePass + cineLights)
function build(S) {
  const objs = {}, tracks = {}
  for (const [k, o] of Object.entries(S.parts || {})) objs[k] = { type: 'part', material: 'SmoothPlastic', parent: null, rot: [0, 0, 0], ...o }
  for (const [k, tr] of Object.entries(S.tracks || {})) tracks[k] = tr
  S.fx.forEach((e, i) => {
    const m = e.sheet ? { grid: 4, frames: 16 } : INDEX[e.slug], src = e.sheet ? genKey(S.sheets[e.sheet]) : e.slug, loop = 'dur' in e, life = e.life ?? (e.sheet ? S.sheets[e.sheet].life ?? 0.9 : 0.6), dur = loop ? e.dur : life
    const tex = paint(src, m.grid, e.ramp, e.tex || 'noise', e.tex_amt ?? 0.35)
    const o = { type: 'flipbook', name: `FX ${e.sheet || e.slug} ${e.t}`, tex, grid: m.grid, frames: m.frames, parent: e.parent || null, pos: e.pos,
      rot: e.rot || [0, 0, 0], size: e.size, start: e.t, life, loop, dur, fps: loop ? (e.fps || 12) : +(m.frames / life).toFixed(2), blend: 'add', flat: !!e.flat }
    if (e.shape === 'beam') Object.assign(o, { shape: 'beam', length: e.length, speed: e.speed ?? 18 })
    if (e.opacity != null) o.opacity = e.opacity
    const id = 'fx' + String(i).padStart(2, '0'); objs[id] = o
    if (e.grow) tracks[id] = { scale: e.grow.map(([t, s, ez]) => [t, [s, s, s], ez || 'auto']) }
  })
  let clip = { name: S.name, len: S.len, fps: 60, loop: false, tracks, camera: S.camera_keys }
  clip = cinePass(clip, { payoff: S.payoff, kind: S.cine_kind || 'burst', tint: S.tint, push: S.push ?? 0.2 }, { pos: S.camera.pos, target: S.camera.target, fov: S.camera.fov })
  const lit = cineLights(objs, clip, { tint: S.tint, impacts: S.impacts, rims: S.rims })
  return { objects: lit.objects, clip: lit.clip, camera: S.camera, env: S.env || {} }
}

// ---------- renderer (Studio viewport conventions)
const LIGHTS = {
  studio: { sky: '#dfe6f2', ground: '#3b3631', hemi: 0.9, sun: '#fff4e5', sunI: 2.4, dir: [0.55, 1, 0.38], env: 0.45 },
  day: { sky: '#bcd8ff', ground: '#5a5040', hemi: 0.8, sun: '#fff1d6', sunI: 3.4, dir: [0.4, 1, 0.25], env: 0.35 },
  sunset: { sky: '#ffb38a', ground: '#3a2a35', hemi: 0.7, sun: '#ff9a5a', sunI: 2.4, dir: [0.9, 0.35, 0.2], env: 0.3 },
  night: { sky: '#4a5a8a', ground: '#101018', hemi: 0.45, sun: '#9fb4ff', sunI: 0.8, dir: [-0.3, 1, 0.5], env: 0.12 }
}
const stage = $('stage')
let renderer
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
} catch (e) { $('load').innerHTML = '<pre class="err"></pre>'; $('load').firstChild.textContent = 'WebGL unavailable: ' + e.message; throw e }
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1)); renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1
stage.prepend(renderer.domElement)
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(50, 16 / 9, 0.05, 2000)
const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
const hemi = new THREE.HemisphereLight(), sun = new THREE.DirectionalLight(); scene.add(hemi, sun, sun.target)
const root = new THREE.Group(); scene.add(root)
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix() }
new ResizeObserver(resize).observe(stage)

// post passes, same shaders and order as Studio anim.js: scene -> grade -> flash
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), quadScene = new THREE.Scene(), quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)); quadScene.add(quad)
const GU = { exp: { value: 0 }, vig: { value: 0 }, tint: { value: 0 }, col: { value: new THREE.Color(1, 1, 1) }, aspect: { value: 1 } }
const vs = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }'
const darkM = new THREE.ShaderMaterial({ uniforms: GU, vertexShader: vs, transparent: true, depthTest: false, depthWrite: false,
  fragmentShader: 'uniform float exp; uniform float vig; uniform float aspect; varying vec2 vUv; void main(){ vec2 d = (vUv - 0.5) * vec2(aspect, 1.0); float r = length(d) / length(vec2(aspect, 1.0) * 0.5); float a = clamp(max(0.0, -exp) + vig * smoothstep(0.45, 1.0, r), 0.0, 1.0); gl_FragColor = vec4(0.0, 0.0, 0.0, a); }' })
const liftM = new THREE.ShaderMaterial({ uniforms: GU, vertexShader: vs, transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
  fragmentShader: 'uniform float exp; uniform float tint; uniform vec3 col; varying vec2 vUv; void main(){ vec2 d = vUv - 0.5; float c = 1.0 - 0.6 * dot(d, d) * 4.0; gl_FragColor = vec4(vec3(max(0.0, exp)) + col * tint * c, 1.0); }' })
const flashM = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthTest: false, depthWrite: false })
function post(g, flash) {
  renderer.autoClear = false
  if (g) {
    GU.aspect.value = camera.aspect; GU.exp.value = Math.max(-1, Math.min(1, g.exp)); GU.vig.value = Math.min(1, Math.max(0, g.vig)); GU.tint.value = Math.min(1, Math.max(0, g.tint)); GU.col.value.set(g.color)
    if (GU.exp.value < 0 || GU.vig.value > 0) { quad.material = darkM; renderer.render(quadScene, ortho) }
    if (GU.exp.value > 0 || GU.tint.value > 0) { quad.material = liftM; renderer.render(quadScene, ortho) }
  }
  const a = Math.max(-1, Math.min(1, flash || 0))
  if (Math.abs(a) > 1e-3) { flashM.color.set(a > 0 ? 0xffffff : 0x000000); flashM.opacity = Math.abs(a); quad.material = flashM; renderer.render(quadScene, ortho) }
  renderer.autoClear = true
}

// flipbooks: Studio's vfx plugin itself, fed painted sheets through a tiny app shim
const listeners = []
const APP = { tex: { get: id => painted.get(id).then(url => ({ data: url })) }, on: (ev, fn) => ev === 'time' && listeners.push(fn), anim: { story: t => t }, time: 0 }
VFX.init(APP)

const D2R = Math.PI / 180, geoCache = {}
function partGeo(shape, s) {
  let g
  switch (shape) {
    case 'sphere': g = new THREE.SphereGeometry(0.5, 32, 18); break
    case 'cylinder': g = new THREE.CylinderGeometry(0.5, 0.5, 1, 32, 1); break
    case 'cone': g = new THREE.ConeGeometry(0.5, 1, 32, 1); break
    case 'torus': { const r = Math.min(s[1], s[0]) / 4, R = s[0] / 2 - r; g = new THREE.TorusGeometry(Math.max(0.01, R), Math.max(0.005, r), 16, 48); g.rotateX(-Math.PI / 2); g.scale(1, 1, s[2] / s[0]); return g }
    case 'plane': g = new THREE.PlaneGeometry(1, 1); g.rotateX(-Math.PI / 2); break
    default: g = new THREE.BoxGeometry(1, 1, 1)
  }
  g.scale(s[0], s[1], s[2]); return g
}
function partMesh(o) {
  const neon = o.material === 'Neon', m = new THREE.MeshStandardMaterial({ color: o.color || '#a3a2a5', roughness: o.roughness ?? (neon ? 0.5 : 0.5), metalness: o.metalness ?? 0, side: THREE.DoubleSide })
  if (neon) { m.emissive.set(o.color || '#ffffff'); m.emissiveIntensity = 1; m.toneMapped = false }
  if (o.emissive) { m.emissive.set(o.emissive); m.emissiveIntensity = o.glow ?? o.emissiveIntensity ?? 1 }
  if (o.transparency) { m.transparent = true; m.opacity = 1 - o.transparency }
  return new THREE.Mesh(partGeo(o.shape || 'box', o.size || [1, 1, 1]), m)
}

let CUR = null, T = 0, playing = true
function clear() {
  for (const n of [...root.children]) root.remove(n)
  root.traverse?.(() => {})
}
async function load(S, say) {
  const bad = validate(S); if (bad.length) throw new Error(bad.join('\n'))
  const res = await renderSheets(S, say)
  const B = build(S); clear()
  const nodes = {}
  for (const [id, o] of Object.entries(B.objects)) {
    let n
    if (o.type === 'part') n = partMesh(o)
    else if (o.type === 'flipbook') { n = VFX.types.flipbook.build(o, APP); n.userData.op = o.opacity }
    else if (o.type === 'light') { n = new THREE.PointLight(o.color, o.intensity * 6, o.range, 1.2) }
    else continue
    n.userData.o = o; nodes[id] = n
  }
  for (const [id, n] of Object.entries(nodes)) { const p = n.userData.o.parent; (p && nodes[p] ? nodes[p] : root).add(n) }
  for (const n of Object.values(nodes)) if (n.userData.op != null) n.userData.card.material.opacity = n.userData.op
  const env = B.env, L = LIGHTS[env.light] || LIGHTS.studio
  scene.background = new THREE.Color(env.bg || '#07060e'); scene.fog = env.fog ? new THREE.Fog(env.fog.color || env.bg, env.fog.near || 20, env.fog.far || 80) : null
  hemi.color.set(L.sky); hemi.groundColor.set(L.ground); hemi.intensity = L.hemi; sun.color.set(L.sun); sun.intensity = L.sunI
  sun.position.set(...L.dir).multiplyScalar(20); scene.environmentIntensity = L.env
  CUR = { S, B, nodes }; APP.anim.story = t => storyAt(B.clip, t)
  const len = B.clip.len, pt = clipTimeOf(B.clip, S.payoff)
  $('pay').style.left = `calc(${(pt / len * 100).toFixed(2)}% - 1px)`
  const nfx = Object.values(B.objects).filter(o => o.type === 'flipbook').length, nl = Object.values(B.objects).filter(o => o.type === 'light').length
  $('meta').textContent = `${S.name} · ${nfx} painted sheets · ${nl} cine lights · story ${S.len}s → clip ${len.toFixed(2)}s (slow-mo) · payoff ${pt.toFixed(2)}s · ${S.cine_kind || 'burst'}`
  const ns = Object.keys(S.sheets || {}).length
  $('tag').textContent = ns ? `generated · ${ns} new sheets` : 'example (library sheets)'
  if (ns) $('meta').textContent += ` · ${ns} new sheets drawn by the library method, jump max ${Math.max(...Object.values(res).map(r => r.jump))}`
  showSheets(S, res)
  $('spec').value = JSON.stringify(S, null, 1); T = 0
  return Promise.all([...new Set(Object.values(B.objects).filter(o => o.tex).map(o => o.tex))].map(id => painted.get(id)))
}
function clipTimeOf(clip, st) { let lo = 0, hi = clip.len; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (storyAt(clip, m) < st) lo = m; else hi = m } return hi }

// camera at story time: Studio anim.js camAt (pos/target/fov + decaying shake)
function camAt(c, t) {
  const k = c?.camera || {}, s = {}
  for (const ch of ['pos', 'target']) if (k[ch]?.length) s[ch] = sample(k[ch], t, 'pos')
  for (const ch of ['fov', 'shake']) if (k[ch]?.length) s[ch] = sample(k[ch].map(q => [q[0], [+q[1]], q[2]]), t, 'pos')[0]
  const a = s.shake || 0
  if (a && s.pos) { const n = f => Math.sin(t * f * 6.2832) * 0.6 + Math.sin(t * f * 2.71 + 1.3) * 0.4; s.pos = [s.pos[0] + a * n(17), s.pos[1] + a * n(23), s.pos[2] + a * n(29)] }
  return s
}
const num = ks => ks.map(q => [q[0], [0, 1, 2].map(i => +(Array.isArray(q[1]) ? q[1][i] : 0) || 0), q[2]])
function frameAt(t) {
  if (!CUR) return
  const { B, nodes } = CUR, clip = B.clip, st = storyAt(clip, t), tr = clip.tracks || {}
  for (const [id, n] of Object.entries(nodes)) {
    const o = n.userData.o, k = tr[id] || {}
    const pos = k.pos ? sample(k.pos, st, 'pos') : o.pos || [0, 0, 0], rot = k.rot ? sample(k.rot, st, 'rot') : o.rot || [0, 0, 0]
    n.position.set(pos[0], pos[1], pos[2])
    if (o.type !== 'light') n.rotation.set(rot[0] * D2R, rot[1] * D2R, rot[2] * D2R, 'XYZ')
    if (k.scale) { const s = sample(k.scale, st, 'scale'); n.scale.set(s[0], s[1], s[2]) }
    if (o.type === 'light') n.intensity = (k.intensity ? sample(k.intensity, st, 'intensity')[0] : o.intensity) * 6
  }
  APP.time = st; for (const fn of listeners) fn(t)
  const c = camAt(clip, st), cam0 = B.camera
  const p = c.pos || cam0.pos, g = c.target || cam0.target
  camera.position.set(p[0], p[1], p[2]); camera.fov = c.fov ?? cam0.fov ?? 50; camera.updateProjectionMatrix(); camera.lookAt(g[0], g[1], g[2])
  const gk = clip.camera?.grade, fk = clip.camera?.flash
  const gv = gk?.length ? sample(num(gk), st, 'pos') : null
  const grade = gv ? { exp: gv[0], vig: gv[1], tint: gv[2], color: clip.camera.gradeTint || '#ffffff' } : null
  const flash = fk?.length ? sample(fk.map(q => [q[0], [+q[1]], q[2]]), st, 'pos')[0] : 0
  renderer.render(scene, camera); post(grade, flash)
  $('hud').textContent = `clip ${t.toFixed(2)}s · story ${st.toFixed(2)}s`
  $('time').textContent = `${t.toFixed(2)} / ${clip.len.toFixed(2)}`
  $('scrub').value = Math.round(t / clip.len * 1000)
}
let last = performance.now(), hold = 0
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now
  if (CUR && playing) { const len = CUR.B.clip.len; if (T >= len) { hold += dt; if (hold > 1) { T = 0; hold = 0 } } else T = Math.min(len, T + dt) }
  frameAt(T); requestAnimationFrame(loop)
}
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play' }
$('restart').onclick = () => { T = 0; hold = 0; playing = true; $('play').textContent = 'Pause' }
$('scrub').oninput = e => { if (!CUR) return; playing = false; $('play').textContent = 'Play'; T = e.target.value / 1000 * CUR.B.clip.len }
// test hook: headless checks seek to an exact clip time
window.vfxgen = { seek: t => { playing = false; T = t; frameAt(t) }, payoff: () => CUR && clipTimeOf(CUR.B.clip, CUR.S.payoff), get spec() { return CUR?.S } }

// ---------- generate: Claude writes the spec (artifact `sample` capability)
const RULES = `You make a VFX clip in two parts, returned as ONE JSON object (no prose, no code fences):
(1) "sheets": NEW flipbook sheets you WRITE as draw scripts. They are drawn by the exact method of the owner's sheet library (the stylized unique.py): 16 frames, 160 px frames drawn at 2x with tapered disc strokes, 6 lingering motes added for you, noise erosion after 55 % of life added for you, glow lighting + edge fade + white Grid4x4 1024 px sheet (light = alpha). Colour is NOT in the script: the player paints each sheet by ramp.
(2) the clip spec that places those sheets in a three.js scene with an automatic cinematic pass (camera push-in, slow-mo, hit-stop, dark dip, white flash, decaying shake, colour grade) and impact/rim lights.

SHEET SCRIPTS: "sheets": {"<id>": {"code": "<JS function body>", "seed": <int>, "life": <s>}}. The body runs once per frame as (pen, rng, t, U); t = 0.05 -> 1 over the 16 frames. Frame coordinates: px, frame 160x160, centre 0,0, x right, y DOWN (negative y = up).
- pen.dot(x,y,r,v=1); pen.stroke(points,w0,w1,v=1) = tapered stroke, radius w0 -> w1 along the points; pen.poly(points,v=1). v = light 0..1 (overlaps replace, not add).
- U.EL.<name>(pen, rngX, t, S) draws one library element at the pen origin, timing built in. Elements: ${Object.keys(EL).join(', ')}. Ring-like (use once, never paired with another ring): shock, ground, vortex, zigring, polyshock, dashring.
  Meanings: crescent slash arc; claw 3-4 parallel arcs; xcut cross slash; thrust stab line; shock ring; ground flat ring; spikes star burst; cracks jagged radial cracks; dashes inward speed dashes; spiral arms; helix twin rising strands; streaks horizontal wind lines; waves wavy lines; puffs soft blob cluster; flames rising licks; bolt lightning; fountain droplets arcing up then falling; beam horizontal beam; orbit circling dots; rise rising dots/crosses; shards spinning shards flying out; column rising blob column; fan upward fan of rays; pillar light pillar; faultline ground crack + debris; comet diagonal comet; petals spinning petals; zigring zigzag ring; bubbles bubble rings rising (hollow circles); vortex inward rings; sparkfall sparks thrown up then falling; polyshock polygon ring; dashring dashed ring.
- U.params(scale, overrides) -> S {R radius px, w width mult 0.7-1.4, n 1-6, k count 5-12, sweep 1.8-3.6, sq squash 0.45-1}. Primary scale 0.8-0.95, partner 0.65-0.85. Override k for counts (e.g. {k: 12}).
- U.at(x,y) sets the pen origin; U.rng(0) = a separate stable random stream (for the partner); U.ease(x) = 1-(1-x)^3 clamped; U.arc(r,a0,a1,{cx,cy,sq,rot,k}); U.jag(rngX,x0,y0,x1,y1,k,amp); U.linspace(a,b,n); U.C = 160.
- rng is re-seeded every frame: call it in the same order every frame so particles keep their paths. Never Math.random, never Date. Return {motes:false} only for a clean single shape.
- HOUSE STYLE (how every library sheet is made, keep it): one primary element at the origin + at most one partner element. Draw the partner FIRST at U.at(0,0) | U.at(U.C*.18,0) | U.at(0,U.C*.2) with U.rng(0), then U.at(0,0) and the primary with rng. Write custom pen strokes only when no element shows the action (e.g. a bubble swelling then popping); then copy the element style: fast-in timing with U.ease(t/0.3..0.5), tapered widths 0.4..8, hollow rings as stroke(U.arc(...)) width 1.2-5, everything inside radius ~70 px, never fade by hand (the wrapper erodes).
- Template: const S2 = U.params(0.75), S1 = U.params(0.9, {k: 10})\nU.at(0, U.C*.2); U.EL.shock(pen, U.rng(0), t, S2); U.at(0, 0)\nU.EL.bubbles(pen, rng, t, S1)
- Write 4-8 sheets, one per layer role of THIS animation (e.g. poison bubble burst: swelling bubble + pop ring, bubble cluster rising, droplet fountain, splash shards, ground splash ring, lingering rising bubbles). "life" = 0.5-1.6 s.

CLIP SPEC (same schema as the example, but every fx uses "sheet": "<id>" from your sheets; NO library slugs). All times are STORY seconds (the cine pass adds ~2 s of slow-mo around the payoff itself).
- name, len (4..14 s), payoff (the ONE biggest moment), cine_kind "impact" (sharp hit) or "burst" (build then release), tint "#rrggbb" (light tint of the dominant hue), push (0.1..0.35).
- camera {pos,target,fov} at t=0; camera_keys {pos:[[t,[x,y,z],"auto"]...], target:[...], fov:[[t,deg,"auto"]...]}: slow orbit/drift over 0..len with a key exactly at payoff; y-up metres.
- env {bg "#hex" dark, fog null, grid false, light "night"|"sunset"|"studio"|"day"}.
- parts {id:{shape box|cylinder|sphere|cone|torus|plane, name, size [x,y,z], pos, rot [deg], color, roughness, material "Neon" for glowing parts, emissive, emissiveIntensity, transparency}}. Cylinder axis Y; floor = cylinder size [0.2,24,24] rot [0,0,90]. Build the described object from primitives (e.g. the poison bubble as a sphere with transparency 0.5 + emissive); dressing only if asked.
- tracks {partId:{pos|rot|scale:[[t,[x,y,z],ease]...]}}: "auto" through motion; anticipation (squash/pull-back "in" 0.1-0.15 s before) then "out" pop on the hit, settle "auto". A part that bursts scales to [0.01,0.01,0.01] at the payoff.
- fx [{sheet, t, life (one-shot) OR dur (+fps 12-16, loops), pos, size (metres 2-10), parent (optional part id), flat (true = ground decal), opacity (0.4-0.8 for big back layers), rot, grow [[t,scale],...], ramp, tex, tex_amt}].
- ramp: fire, ice, electric, poison, holy, void, blood, wind, or "#edge,#mid,...,#core" (3-5 stops dark edge -> white-ish core). tex "noise"|"cells"|"streaks"|"none", tex_amt 0.25-0.4.
- impacts [{t, at [x,y,z], color "#hex", payoff true on exactly one}], rims [{pos, color, base 1.0-1.5}] 1-2.

QUALITY FLOOR (the owner's standard): ONE dominant hue + white-hot core + at most one accent ramp. Layer every hit: glow (big, faint) + core (the shape) + sparks/droplets. Payoff = 3-4 sheets at once, the largest sizes; build-up sparse; fast in, slow out; 0.5-1.5 s lingering after the payoff; t + life/dur <= len. 8-24 fx. Exactly what the owner describes, nothing extra.`
let ctl = null
function extractJSON(t) { const a = t.indexOf('{'), b = t.lastIndexOf('}'); if (a < 0 || b <= a) throw new Error('no JSON in the reply'); return JSON.parse(t.slice(a, b + 1)) }
async function generate() {
  const want = $('prompt').value.trim(); if (!want) return status('Type the animation you want first.', 'bad')
  store.set('vfxgen.prompt', want)
  const S = await samplerP; if (!S) return status('Generation needs the Claude sample permission; playback and spec editing still work.', 'bad')
  const example = JSON.stringify(DEFAULT)
  const msgs = [{ role: 'user', content: `${RULES}\n\nEXAMPLE CLIP SPEC (schema only: it uses library slugs, yours must use your own sheets):\n${example}\n\nOWNER'S ANIMATION:\n${want}\n\nWrite the JSON (sheets + clip spec) for the owner's animation now.` }]
  $('gen').disabled = true; $('stop').hidden = false
  try {
    for (let round = 0; round < 3; round++) {
      ctl = new AbortController()
      status(round ? `Fixing (try ${round + 1}/3)…` : 'Claude is writing the sheet scripts…')
      const res = await S(msgs, { modelTier: 'complex', signal: ctl.signal, cache: false, onText: ({ text }) => status((round ? 'Fixing… ' : 'Writing the sheet scripts… ') + text.length + ' chars') })
      let spec, errs
      try { spec = extractJSON(res.text); errs = validate(spec); if (!Object.keys(spec.sheets || {}).length) errs.push('no sheets: write the draw scripts in "sheets"'); (spec.fx || []).forEach((e, i) => { if (!e.sheet) errs.push(`fx[${i}]: use "sheet" (your own new sheet), not a library slug`) }) } catch (e) { errs = ['invalid JSON: ' + e.message] }
      if (!errs.length) {
        try { await load(spec, m => status(m)); status('Painting and lighting the clip…'); playing = true; T = 0; $('play').textContent = 'Pause'; return status(`Generated "${spec.name}".`, 'ok') }
        catch (e) { errs = ['build failed: ' + e.message] }
      }
      if (round === 2) return status('Failed: ' + errs.join('; '), 'bad')
      msgs.push({ role: 'assistant', content: res.text }, { role: 'user', content: `That spec failed these checks:\n- ${errs.join('\n- ')}\nReturn the corrected full JSON only.` })
    }
  } catch (e) { status(e?.name === 'AbortError' || e?.code === 'aborted' ? 'Stopped.' : 'Failed: ' + (e?.message || e?.code || e), 'bad') }
  finally { $('gen').disabled = false; $('stop').hidden = true; ctl = null }
}
$('gen').onclick = generate
$('stop').onclick = () => ctl?.abort()
$('apply').onclick = async () => { try { await load(JSON.parse($('spec').value), m => status(m)); playing = true; status('Applied.', 'ok') } catch (e) { status('Failed: ' + e.message, 'bad') } }
$('dl').onclick = async () => {
  const d = await dlP, data = $('spec').value, name = ((CUR?.S?.name || 'vfx').replace(/[^\w-]+/g, '-').toLowerCase()) + '.spec.json'
  if (!d) return status('Downloads are not available here; copy the JSON from the box.', 'bad')
  try { await d.save({ filename: name, data }); status('Saved ' + name, 'ok') } catch (e) { status('Download not saved: ' + (e?.message || e?.code || e), 'bad') }
}
const cap = n => (window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null))
const samplerP = cap('sample'), dlP = cap('downloads')
samplerP.then(s => { if (!s) { $('gen').disabled = true; status('Generation needs the Claude sample capability (open this inside Claude-Hub). Playback and the spec editor work.') } })

// ---------- boot: the showcase spec plays first
let DEFAULT = null
$('prompt').value = store.get('vfxgen.prompt') || ''
try {
  await loadIndex()
  DEFAULT = await (await fetch('spec.json')).json()
  await load(DEFAULT)
  $('load').remove()
} catch (e) { $('load').innerHTML = '<pre class="err"></pre>'; $('load').firstChild.textContent = 'Failed to load: ' + e.message; console.error(e) }
requestAnimationFrame(loop)
</script>
