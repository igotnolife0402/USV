 <path d="M22 34a28 26 0 0 1 22-20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".85"/>
 <ellipse cx="33" cy="25" rx="4" ry="3" fill="#fff" opacity=".95"/>
